# Parameters for the gimbal Pi. Values marked TBD are not chosen yet
# (ARCHITECTURE.md 5.3). The nodes refuse to start until they are set.

predictor:
  ros__parameters:
    # predictor_period: TBD  # s
    # horizon_dt: TBD        # s, spacing of the predicted samples (= control period Δt)
    # horizon_steps: TBD     # F, number of predicted samples (T4: F·Δt ≥ predictor period + T_a + latency)
    tau_v: 0.094             # s, measured (tools/sysid, ARCHITECTURE.md 5.3)
    tau_omega: 0.120         # s, measured (tools/sysid, ARCHITECTURE.md 5.3)
    command_timeout: 0.2     # s, /base_command older than this (by arrival time) is not used
    state_timeout: 0.1       # s, /odom and gyro samples must be at most this much older than the command

gimbal_control:
  ros__parameters:
    # control_period: TBD    # s, = dt
    mode: feedback_only      # feedback_only | prediction_assisted

imu_a:                       # gimbal_control imu_node (standalone IMU A publisher)
  ros__parameters:
    bus: 3                   # /dev/i2c-3, i2c-gpio overlay (GPIO23/24)
    address: 0x4B
    accel: true              # also read the accelerometer (incl. gravity)
    report_interval: 0.01    # s, gyro (and accel) report period. Tested: 100 and 200 Hz OK; >= 250 Hz the
                             # stream stalls without errors (Adafruit library + software I2C)
    timeout: 0.1             # s without a sample -> error
    frame_id: imu_a

vision:
  ros__parameters: {}
